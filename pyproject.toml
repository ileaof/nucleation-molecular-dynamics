[project]
name = "nucleation_md"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["characterization: documents current behaviour of the continuum script"]
